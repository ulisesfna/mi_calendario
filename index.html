<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Calendario</title>
  <meta name="description" content="Calendario de eventos, tareas y planning con categorías y avisos personalizables">
  <meta name="theme-color" content="#5b4bdb">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icons/icon-192.png">
  <link rel="stylesheet" href="css/app.css?v=4">
</head>
<body>
  <div id="app">
    <aside id="sidebar" aria-label="Menú">
      <div class="brand"><img src="icons/icon.svg" alt="" width="28" height="28"><b>Mi calendario</b></div>
      <div class="create-row">
        <button class="btn primary create" id="createBtn">＋ Crear</button>
        <button class="btn icon-only" data-create="task" title="Nueva tarea (T)">✅</button>
        <button class="btn icon-only" data-create="plan" title="Nuevo planning (L)">🗺️</button>
      </div>
      <div id="minical" class="minical"></div>
      <div class="filters" data-filters></div>
      <div id="cats" class="cats"></div>
      <div class="side-tools">
        <button class="btn block" id="importBtn">🎓 Importar horario (Chronos / .ics)</button>
        <button class="btn block" id="installBtn" hidden>📲 Instalar como aplicación</button>
        <button class="btn block sync-btn" id="syncBtn">☁️ Sincronización</button>
      </div>
      <div class="side-foot">
        <button class="btn link" id="settingsBtn">⚙️ Ajustes</button>
        <button class="btn link" id="helpBtn">⌨️ Atajos <kbd>?</kbd></button>
      </div>
    </aside>
    <div id="scrim"></div>

    <main id="main">
      <header id="topbar">
        <button class="icon-btn" id="menuBtn" title="Menú">☰</button>
        <button class="btn" id="todayBtn" title="Hoy (H)">Hoy</button>
        <div class="nav-arrows" id="navArrows">
          <button class="icon-btn" id="prevBtn" title="Anterior (←)">‹</button>
          <button class="icon-btn" id="nextBtn" title="Siguiente (→)">›</button>
        </div>
        <h1 id="rangeTitle"></h1>
        <div class="quick">
          <input id="quickInput" class="input" placeholder="⚡ Añadir rápido: «Estudiar mañana 18:00 2h #Física !alarma»" autocomplete="off" aria-label="Añadir rápido">
          <div id="quickHint" class="quick-hint" hidden></div>
        </div>
        <nav class="seg views" id="viewSeg" aria-label="Vista"></nav>
        <button class="icon-btn show-btn" id="showBtn" title="Qué mostrar">👁</button>
        <button class="icon-btn bell" id="bellBtn" title="Avisos">🔔<span class="badge-dot" id="bellCount" hidden></span></button>
        <button class="icon-btn" id="undoBtn" title="Deshacer (Ctrl+Z)">↶</button>
      </header>
      <div id="view"></div>
    </main>

    <nav id="bottomnav" aria-label="Vista"></nav>
    <button id="fab" title="Crear">＋</button>
  </div>

  <div id="popover" hidden></div>
  <div id="alarm" hidden></div>
  <div id="toasts" aria-live="polite"></div>
  <script type="module" src="js/app.js?v=4"></script>
</body>
</html>
